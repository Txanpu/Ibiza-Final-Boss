<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ruleta de la suerte</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f3f4f6;
    }

    .wheel {
      position: relative;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      transition: transform 4s cubic-bezier(0.33, 1, 0.68, 1);
    }

    #labels {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 0 0;
      text-align: center;
    }

    .label span {
      display: block;
      transform: translate(-50%, -50%);
    }

    .label.win span {
      font-weight: bold;
      animation: winner 0.6s ease-out;
    }

    @keyframes winner {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    .controls {
      margin-top: 20px;
      text-align: center;
    }

    .muted {
      color: #6b7280;
      font-size: 0.8rem;
      margin-left: 0.5rem;
    }

    .result {
      margin-top: 10px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <main>
    <div id="wheel" class="wheel">
      <div id="labels"></div>
    </div>
    <div class="controls">
      <button id="spin">Girar</button>
      <span class="muted">Haz clic para decidir</span>
    </div>
    <p id="result" class="result"></p>
  </main>

  <script>
    // === Edita aquí si quieres cambiar opciones ===
    const OPTIONS = ["chupito", "fary", "carreras", "mdma", "fiore"];
    // Paleta (se repite si faltan colores)
    const COLORS = ["#f97316", "#22c55e", "#60a5fa", "#a78bfa", "#f43f5e", "#fbbf24"]; // nítidos

    const wheel = document.getElementById('wheel');
    const labels = document.getElementById('labels');
    const spinBtn = document.getElementById('spin');
    const resultEl = document.getElementById('result');

    const N = OPTIONS.length;
    const SLICE = 360 / N;
    const centers = OPTIONS.map((_, i) => i * SLICE + SLICE / 2); // desde top (0º) sentido horario

    // Dibuja el fondo con conic-gradient, empezando desde arriba (from -90deg)
    const stops = [];
    for (let i = 0; i < N; i++) {
      const c = COLORS[i % COLORS.length];
      const start = i * SLICE;
      const end = (i + 1) * SLICE;
      stops.push(`${c} ${start}deg ${end}deg`);
    }
    wheel.style.background = `conic-gradient(from -90deg, ${stops.join(', ')})`;

    // Crea etiquetas equiespaciadas
    function mkLabel(text, angleDeg){
      const d = document.createElement('div');
      d.className = 'label';
      d.style.transform = `rotate(${angleDeg}deg) translate(0, -43%) rotate(${-angleDeg}deg)`;
      const s = document.createElement('span'); s.textContent = text; d.appendChild(s);
      return d;
    }
    centers.forEach((a, i) => labels.appendChild(mkLabel(OPTIONS[i], a)));

    // Utilidad: entero aleatorio seguro [0, max)
    function secureInt(max){
      const buf = new Uint32Array(1); crypto.getRandomValues(buf); return buf[0] % max;
    }

    let current = 0; // rotación acumulada en grados
    let spinning = false;

    function spin(){
      if (spinning) return;
      spinning = true; spinBtn.disabled = true; resultEl.textContent = '';

      const winner = secureInt(N); // índice ganador
      const spins = 6 + secureInt(3); // 6..8 giros completos

      const targetAtTop = (360 - centers[winner]) % 360; // ángulo (0..359) que debe quedar para que el centro gane
      const currentMod = ((current % 360) + 360) % 360; // normaliza
      const deltaToAlign = ((targetAtTop - currentMod) + 360) % 360; // cuánto falta para alinear

      const extra = spins * 360 + deltaToAlign; // añade giros completos para animación vistosa
      const next = current + extra;

      // Quita marca anterior
      document.querySelectorAll('.label.win').forEach(el => el.classList.remove('win'));

      wheel.style.transform = `rotate(${next}deg)`;

      const onEnd = () => {
        wheel.removeEventListener('transitionend', onEnd);
        current = next; // fija el nuevo estado
        spinning = false; spinBtn.disabled = false;
        // Marca ganador
        const lab = labels.children[winner]; lab.classList.add('win');
        resultEl.textContent = `Resultado: ${OPTIONS[winner]}`;
      };
      wheel.addEventListener('transitionend', onEnd, { once: true });
    }

    spinBtn.addEventListener('click', spin);
    // Doble clic en la rueda también gira
    wheel.addEventListener('dblclick', spin);
  </script>
</body>
</html>
